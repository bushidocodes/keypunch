name: CI

# Run on every push to master and every PR.
# - lint:          ESLint flat config over app/ + electron/ + harness/.
# - typecheck:     tsc --noEmit (TypeScript, Phase 6).
# - harness-tests: vitest unit + integration (mock FTP/JES round-trip).
# - build:         electron-vite production build, asserting the main/preload/renderer artifacts.
# - e2e:           Playwright `_electron` GUI journey driving the real built app against the
#                  mock JES server, under xvfb (Phase 5).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      # Linting doesn't need the Electron binary; skip it to keep this job fast.
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      # Typechecking doesn't need the Electron binary; skip it to keep this job fast.
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck

  harness-tests:
    name: Harness tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      # Install root deps first so react / react-dom / react-redux resolve from
      # the project root's node_modules — the component tests rely on a single
      # shared copy of React rather than maintaining a separate one in harness/.
      - name: Install root deps (no Electron binary)
        run: npm install --no-audit --no-fund
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm ci
      - run: npm test

  build:
    name: Build (electron-vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      # The Electron binary download is not needed just to build; skip it to keep CI fast.
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Verify build artifacts
        run: test -f out/main/main.js && test -f out/preload/preload.js && test -f out/renderer/index.html

  e2e:
    name: E2E (Playwright _electron + xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      # Root install DOES download the Electron binary — the e2e launches the real app.
      - name: Install root deps (incl. Electron binary)
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Install harness deps
        run: npm ci
        working-directory: harness
      # Electron's Chromium needs the same system libraries Playwright's chromium does.
      - name: Install Electron/Chromium system libraries
        run: npx playwright install-deps chromium
        working-directory: harness
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run Playwright e2e under xvfb
        run: xvfb-run -a npm run e2e
        working-directory: harness
