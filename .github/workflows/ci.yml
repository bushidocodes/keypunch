name: CI

# Run on every push to master and every PR.
# - lint:          ESLint flat config over app/ + electron/ + harness/.
# - typecheck:     tsc --noEmit over app/ + electron/ (root tsconfig).
# - harness-tests: harness tsc typecheck + vitest unit + integration (mock FTP/JES round-trip).
# - build:         electron-vite production build, asserting the main/preload/renderer artifacts.
# - e2e:           Playwright `_electron` GUI journey driving the real built app against the
#                  mock JES server, under xvfb (Phase 5).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      # Linting doesn't need the Electron binary; skip it to keep this job fast.
      - run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      # Typechecking doesn't need the Electron binary; skip it to keep this job fast.
      - run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm typecheck

  harness-tests:
    name: Harness tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      # pnpm workspace install covers root + harness in one pass.
      # React resolves from root node_modules — single shared instance, no duplicate hooks.
      - name: Install all workspace deps (no Electron binary)
        run: pnpm install
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build (electron-vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      # The Electron binary download is not needed just to build; skip it to keep CI fast.
      - run: pnpm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build
      - name: Verify build artifacts
        run: test -f out/main/main.cjs && test -f out/preload/preload.cjs && test -f out/renderer/index.html

  e2e:
    name: E2E (Playwright _electron + xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      # Root install DOES download the Electron binary — the e2e launches the real app.
      # pnpm workspace install covers root + harness in one pass.
      - name: Install all workspace deps (incl. Electron binary)
        run: pnpm install
      - name: Build app
        run: pnpm build
      # Electron's Chromium needs the same system libraries Playwright's chromium does.
      # Use the direct binary path (not pnpm exec) to avoid pnpm workspace resolution
      # changing the PLAYWRIGHT_BROWSERS_PATH context and triggering a browser download.
      # pnpm workspace puts harness devDep binaries in harness/node_modules/.bin/, not root.
      - name: Install Electron/Chromium system libraries
        run: node_modules/.bin/playwright install-deps chromium
        working-directory: harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run Playwright e2e under xvfb
        run: xvfb-run -a pnpm e2e
        working-directory: harness
