name: CI

# Run on every push to master and every PR.
# - harness-tests: the unit + integration (mock FTP/JES round-trip) suite on modern Node.
# - build:         the electron-vite production build on modern Node, asserting the
#                  main/preload/renderer artifacts are emitted (Phase 1 toolchain).
# The Playwright GUI e2e (harness/e2e) runs locally for now — it needs the Electron
# binary + a display; wiring it into CI (xvfb) is a Phase 5 task. See MODERNIZATION.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  harness-tests:
    name: Harness tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build (electron-vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # The Electron binary download is not needed just to build; skip it to keep CI fast.
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Verify build artifacts
        run: test -f out/main/main.js && test -f out/preload/preload.js && test -f out/renderer/index.html
