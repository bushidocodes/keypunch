packages:
  - 'harness'

# One React version for the app (root) and the harness. The harness declares
# react/react-dom itself (via this catalog) so @testing-library/react resolves
# its peers to the SAME copy the app components import; otherwise a lockfile
# refresh can give RTL a second React and every hook throws
# "Cannot read properties of null (reading 'useState')".
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1

allowBuilds:
  electron-winstaller: true
  esbuild: true

# Floors for transitive packages with open Dependabot alerts. esbuild and tar
# stay where they are; minimatch 9/10 stay put because the fix is 11.0.1.
overrides:
  undici: ^7.30.1
  esbuild: ^0.28.1
  js-yaml: ^4.3.2
  fast-uri: '>=4.2.3 <5'
  tar: '>=7.5.18'
  brace-expansion@1: 1.1.22
  brace-expansion@2: 2.1.8
  brace-expansion@5: 5.0.13
  '@xmldom/xmldom': 0.8.15
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
