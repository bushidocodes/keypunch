packages:
  - 'harness'

# One React version for the app (root) and the harness. The harness declares
# react/react-dom itself (via this catalog) so @testing-library/react resolves
# its peers to the SAME copy the app components import; otherwise a lockfile
# refresh can give RTL a second React and every hook throws
# "Cannot read properties of null (reading 'useState')".
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1

allowBuilds:
  electron-winstaller: true
  esbuild: true

overrides:
  undici: '^7.29.0'
  esbuild: ^0.28.1
  js-yaml: '^4.3.0'
  fast-uri: '>=3.1.4'
  tar: '>=7.5.18'
  brace-expansion@1: 1.1.16
  brace-expansion@2: 2.1.2
